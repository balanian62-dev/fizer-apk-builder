name: Build HTML to APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare HTML
        run: |
          mkdir -p www
          if [ -f index.html ]; then
            cp index.html www/index.html
          else
            echo '<html><body><h1>Fizer App</h1></body></html>' > www/index.html
          fi

      - name: Configure Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android
          npm install --save-dev @capacitor/cli
          npx cap init FizerApp ir.fizer.app --web-dir=www
          npx cap add android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Fizer-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 3
