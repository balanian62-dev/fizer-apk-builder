name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: HTTPS website URL to wrap
        required: true
        type: string
      app_name:
        description: App display name
        required: true
        type: string
      bundle_id:
        description: iOS bundle identifier
        required: true
        type: string
      logo_url:
        description: Public temporary URL of the 1024px PNG app icon
        required: true
        type: string

permissions:
  contents: read

# Prevent accidental overlap from consuming multiple macOS runners.
concurrency:
  group: ios-ipa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Use GitHub's currently supported macOS image rather than pinning to
    # a specific image version that may have temporary capacity issues.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Runner diagnostics
        run: |
          echo "Runner: $RUNNER_OS"
          sw_vers
          xcodebuild -version
          node --version || true

      - name: Validate inputs
        env:
          WEBSITE_URL: ${{ inputs.website_url }}
          APP_NAME: ${{ inputs.app_name }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
          LOGO_URL: ${{ inputs.logo_url }}
        run: |
          python3 - <<'PY'
          import os, re, urllib.parse
          u = urllib.parse.urlparse(os.environ["WEBSITE_URL"])
          assert u.scheme == "https" and u.netloc, "A valid HTTPS URL is required"
          assert 2 <= len(os.environ["APP_NAME"]) <= 30, "App name must be 2-30 chars"
          assert re.fullmatch(r"[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+", os.environ["BUNDLE_ID"]), "Invalid bundle ID"
          PY

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create Capacitor iOS project
        env:
          WEBSITE_URL: ${{ inputs.website_url }}
          APP_NAME: ${{ inputs.app_name }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          mkdir ios-wrapper
          cd ios-wrapper
          mkdir www
          printf '<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>Loading…</body></html>' > www/index.html
          npm init -y
          npm install --no-audit --no-fund @capacitor/core @capacitor/ios
          npm install --no-audit --no-fund --save-dev @capacitor/cli
          npm install --no-audit --no-fund --save-dev @capacitor/assets
          mkdir -p assets
          curl --fail --silent --show-error --location "$LOGO_URL" --output assets/logo.png
          python3 - <<'PY'
          from PIL import Image
          im = Image.open("assets/logo.png")
          w, h = im.size
          assert im.format == "PNG" and w == h and w >= 1024, f"Logo must be square PNG at least 1024x1024; got {w}x{h}"
          PY
          python3 - <<'PY'
          import json, os
          config = {
              "appId": os.environ["BUNDLE_ID"],
              "appName": os.environ["APP_NAME"],
              "webDir": "www",
              "server": {"url": os.environ["WEBSITE_URL"], "cleartext": False}
          }
          with open("capacitor.config.json", "w") as f:
              json.dump(config, f)
          PY
          npx cap add ios
          npx cap sync ios
          npx @capacitor/assets generate --ios --iconBackgroundColor '#ffffff' --splashBackgroundColor '#ffffff'

      - name: Check signing configuration
        id: signing
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [ -n "$IOS_CERTIFICATE_BASE64" ] && [ -n "$IOS_CERTIFICATE_PASSWORD" ] && [ -n "$IOS_PROVISION_PROFILE_BASE64" ] && [ -n "$IOS_TEAM_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            CERT_PATH="$RUNNER_TEMP/distribution.p12"
            PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
            KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
            echo "$IOS_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
            echo "$IOS_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"
            security create-keychain -p "$IOS_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$IOS_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
            security import "$CERT_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security list-keychains -d user -s "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$IOS_CERTIFICATE_PASSWORD" "$KEYCHAIN_PATH"
            security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
            PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
            echo "profile_uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Apple signing secrets not configured; producing an unsigned IPA."
          fi

      - name: Build unsigned IPA
        if: steps.signing.outputs.enabled != 'true'
        run: |
          cd ios-wrapper
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO
          APP_PATH="build/Build/Products/Release-iphoneos/App.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/App.app
          zip -qry ../FizerApp-unsigned.ipa Payload

      - name: Build and export signed IPA
        if: steps.signing.outputs.enabled == 'true'
        env:
          BUNDLE_ID: ${{ inputs.bundle_id }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
        run: |
          cd ios-wrapper
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos -archivePath "$RUNNER_TEMP/FizerApp.xcarchive" archive CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$IOS_TEAM_ID" PROVISIONING_PROFILE="$PROFILE_UUID" CODE_SIGN_IDENTITY="Apple Distribution"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>ad-hoc</string>
          <key>teamID</key><string>$IOS_TEAM_ID</string>
          <key>signingStyle</key><string>manual</string>
          <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_UUID</string></dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/FizerApp.xcarchive" -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          cp "$RUNNER_TEMP/export/"*.ipa ../FizerApp-signed.ipa

      - name: Upload unsigned IPA
        if: steps.signing.outputs.enabled != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-unsigned
          path: FizerApp-unsigned.ipa
          if-no-files-found: error
          retention-days: 5

      - name: Upload signed IPA
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-signed
          path: FizerApp-signed.ipa
          if-no-files-found: error
          retention-days: 5
